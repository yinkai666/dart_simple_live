name: iPad build

on:
  push:
    branches:
      - codex/ipad-multiview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipad:
    if: github.ref == 'refs/heads/codex/ipad-multiview'
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: simple_live_app
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: simple_live_app/pubspec.yaml
          channel: stable
          cache: true

      - name: Restore packages
        run: flutter pub get

      - name: Check multiview layout and task isolation
        run: |
          dart test/multiview/layout_check.dart
          dart test/multiview/multi_view_roster_check.dart
          dart test/multiview/multi_view_playback_check.dart
          dart test/multiview/multi_view_danmaku_buffer_check.dart
          dart test/multiview/gesture_check.dart
          dart test/room_task_scope_regression.dart
          dart test/playback_recovery_check.dart
          dart test/bounded_chat_buffer_check.dart
          flutter test --no-pub test/danmaku_emoticon_test.dart
          flutter test --no-pub test/danmaku_admission_test.dart
          flutter test --no-pub test/multiview/material_scope_test.dart test/multiview/gesture_surface_test.dart
          flutter analyze --no-pub lib/modules/multiview

      - name: Check native danmaku window boundaries
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Prepare native mpv build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/mpv-tools"
          "$RUNNER_TEMP/mpv-tools/bin/python" -m pip install 'meson==1.8.5' 'ninja==1.13.0'
          echo "$RUNNER_TEMP/mpv-tools/bin" >> "$GITHUB_PATH"
          command -v pkg-config >/dev/null || brew install pkgconf

      - name: Rebuild iPad mpv with upstream EOF assertion fix
        run: python3 ../scripts/native-mpv/build_patched_mpv.py --app-dir .

      - name: Build iPad app
        run: flutter build ios --release --no-codesign

      - name: Verify embedded patched mpv and symbols
        run: |
          python3 ../scripts/native-mpv/verify_patched_mpv.py \
            --app-dir . --manifest build/native-mpv/manifest.json \
            --dsym build/native-mpv/Mpv.framework.dSYM \
            --patch ../scripts/native-mpv/patches/0001-mpv-0.36-preserve-eof-seek-state.patch \
            --report build/native-mpv/embedded-verification.json

      - name: Verify iPad identity and package unsigned IPA
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          with Path('build/ios/iphoneos/Runner.app/Info.plist').open('rb') as source:
              info = plistlib.load(source)
          assert info['CFBundleIdentifier'] == 'com.yinkai666.slive.ipad', info['CFBundleIdentifier']
          assert info['CFBundleDisplayName'] == 'Slive iPad'
          assert info['UIDeviceFamily'] == [2], info['UIDeviceFamily']
          assert info.get('UIRequiresFullScreen') is False
          assert len(info['UISupportedInterfaceOrientations~ipad']) == 4
          PY
          mkdir -p build/ipad/Payload
          ditto build/ios/iphoneos/Runner.app build/ipad/Payload/Runner.app
          cd build/ipad
          zip -q -r Slive-iPad-unsigned.ipa Payload

      - name: Upload unsigned iPad package
        uses: actions/upload-artifact@v7
        with:
          name: Slive-iPad-unsigned
          path: simple_live_app/build/ipad/Slive-iPad-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload native mpv symbols and build provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Slive-iPad-native-mpv-symbols
          path: simple_live_app/build/native-mpv/
          if-no-files-found: warn
          retention-days: 30
