name: PR Check

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-mac-ios-android:
    runs-on: macos-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: "21"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: simple_live_app/pubspec.yaml
          cache: true

      - name: Enable Flutter Desktop
        run: flutter config --enable-macos-desktop

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --debug

      - name: Check playback stability regressions
        run: |
          cd simple_live_app
          dart test/bounded_chat_buffer_check.dart
          dart test/playback_recovery_check.dart
          dart test/room_task_scope_regression.dart
          flutter test --no-pub test/live_room_follow_sort_test.dart test/danmaku_admission_test.dart test/danmaku_emoticon_test.dart
          cargo test --manifest-path rust/Cargo.toml

      - name: Prepare native mpv build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/mpv-tools"
          "$RUNNER_TEMP/mpv-tools/bin/python" -m pip install 'meson==1.8.5' 'ninja==1.13.0'
          echo "$RUNNER_TEMP/mpv-tools/bin" >> "$GITHUB_PATH"
          command -v pkg-config >/dev/null || brew install pkgconf

      - name: Rebuild iOS mpv with upstream EOF assertion fix
        run: |
          python3 -m unittest discover -s scripts/native-mpv -p 'test_*.py'
          python3 scripts/native-mpv/build_patched_mpv.py --app-dir simple_live_app

      - name: Build IPA
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign --no-pub

      - name: Install and verify patched mpv
        run: |
          python3 scripts/native-mpv/verify_patched_mpv.py \
            --app-dir simple_live_app \
            --manifest simple_live_app/build/native-mpv/manifest.json \
            --install-from simple_live_app/build/native-mpv/Mpv \
            --dsym simple_live_app/build/native-mpv/Mpv.framework.dSYM \
            --patch scripts/native-mpv/patches/0001-mpv-0.36-preserve-eof-seek-state.patch \
            --report simple_live_app/build/native-mpv/embedded-verification.json
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          with Path('simple_live_app/build/ios/iphoneos/Runner.app/Info.plist').open('rb') as source:
              info = plistlib.load(source)
          assert info['CFBundleIdentifier'] == 'com.yinkai666.slive', info['CFBundleIdentifier']
          assert sorted(info['UIDeviceFamily']) == [1, 2], info['UIDeviceFamily']
          PY

      - name: Upload native mpv symbols and build provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-ios-native-mpv-symbols
          path: simple_live_app/build/native-mpv/
          if-no-files-found: warn
          retention-days: 14

      - name: Install appdmg
        run: npm install -g appdmg

      - name: Install fast-forge
        run: |
          git clone https://github.com/SlotSun/fastforge.git
          cd fastforge
          dart pub global activate melos
          melos run activate

      - name: Build MacOS
        run: |
          cd simple_live_app
          fastforge package --platform macos --targets dmg,zip --skip-clean

  build-linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: simple_live_app/pubspec.yaml
          channel: master

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev unzip libasound2-dev gcc g++ autoconf automake \
              debhelper glslang-dev ladspa-sdk xutils-dev libasound2-dev libarchive-dev libbluray-dev \
              libdav1d-dev libdvdnav-dev libegl1-mesa-dev libepoxy-dev libfontconfig-dev libfreetype6-dev \
              libfribidi-dev libgl1-mesa-dev libgbm-dev libgme-dev libgsm1-dev libharfbuzz-dev libjpeg-dev \
              libbrotli-dev liblcms2-dev libmodplug-dev libmp3lame-dev libopenal-dev \
              libopus-dev libopencore-amrnb-dev libopencore-amrwb-dev libpulse-dev librtmp-dev \
              libsdl2-dev libsixel-dev libssh-dev libsoxr-dev libspeex-dev libtool \
              libv4l-dev libva-dev libvdpau-dev libvorbis-dev libvo-amrwbenc-dev \
              libunwind-dev libvpx-dev libwayland-dev libx11-dev libxext-dev libdrm-dev \
              libxkbcommon-dev libxrandr-dev libxss-dev libxv-dev libxvidcore-dev \
              linux-libc-dev nasm ninja-build pkg-config python3 python3-docutils wayland-protocols \
              x11proto-core-dev zlib1g-dev libfdk-aac-dev libtheora-dev libwebp-dev \
              unixodbc-dev libpq-dev libxxhash-dev libaom-dev libbs2b-dev libcaca-dev libcdio-paranoia-dev

      - name: Enable Flutter Desktop
        run: flutter config --enable-linux-desktop

      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Install fast-forge
        run: |
          git clone https://github.com/SlotSun/fastforge.git
          cd fastforge
          dart pub global activate melos
          melos run activate

      - name: Build Linux
        run: |
          cd simple_live_app
          fastforge package --platform linux --targets deb,zip --skip-clean
          cd build/dist/*
          mv simple_live_app-*-linux.deb simplelive-${{ matrix.arch }}-linux.deb
          mv simple_live_app-*-linux.zip simplelive-${{ matrix.arch }}-linux.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: simple_live_app/pubspec.yaml
          cache: true

      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop

      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter clean
          flutter pub get

      - name: Install fast-forge
        run: |
          git clone https://github.com/SlotSun/fastforge.git
          cd fastforge
          dart pub global activate melos
          melos run activate

      - name: Build Windows
        run: |
          cd simple_live_app
          fastforge package --platform windows --targets msix,zip --skip-clean

  # 打包 Flatpak
  build-flatpak:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      # 签出代码
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # 安装依赖
      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update -q
          sudo apt-get install -y flatpak flatpak-builder ca-certificates gnupg software-properties-common
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          git config --global protocol.file.allow always
      # 构建 Flatpak bundle
      - name: Build flatpak
        run: |
          flatpak-builder build-dir flatpak/flatpak-manifest.yaml \
            --arch=${{ matrix.arch }} \
            --repo=${{ matrix.arch }} \
            --force-clean \
            --user \
            --install-deps-from=flathub \
            --ccache \
            --disable-rofiles-fuse
